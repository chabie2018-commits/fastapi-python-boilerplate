version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - RAYMINE_ENV=production
      - FASTAPI_RELOAD=false
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - raymine

networks:
  raymine:
    driver: bridge
